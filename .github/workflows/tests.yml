name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_fastapi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend_fastapi/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend unit tests
        # 显式列出模块（与 run_tests.ps1 一致），避免 discover 递归进 venv。
        # test_support 是测试基建 helper，不列入。
        run: |
          python -m unittest test_price_store test_history_store test_instance_lock \
            test_integrity test_mentor_store test_market_symbol test_main test_settings_download -v
