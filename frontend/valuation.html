<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>股票估值计算</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0f;--card:#17171d;--surface:#212129;--line:rgba(255,255,255,.1);--text:#f0f0ef;--sub:#aaa9a4;--muted:#777671;--blue:#3987e5;--red:#ef5350;--green:#3fb950;--orange:#e99a35}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:22px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:21px;margin:0 auto 0 0}
.top .sub{color:var(--muted);font-size:12px;width:100%}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}
.btn:hover{border-color:#ffffff44}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 17px;margin-bottom:14px}
.card-h{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:15px;margin:0 auto 0 0}
.card-b{min-height:40px}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;background:#ffffff12;color:var(--sub)}
.tag.ok{color:var(--green)}.tag.warn{color:var(--orange)}.tag.bad{color:var(--red)}
.empty{color:var(--muted);padding:16px;text-align:center;font-size:13px}
.input-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 11px;font:inherit}
input:focus{outline:none;border-color:var(--blue)}
#codeInput{width:190px;letter-spacing:1px}
.hint{color:var(--muted);font-size:12px}
.hint.bad{color:var(--red)}
.params{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px 14px}
.params.show{display:grid}
.params label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--sub)}
.params input{width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.kpi .k-l{font-size:12px;color:var(--muted)}
.kpi .k-v{font-size:19px;font-family:ui-monospace,Consolas,monospace;margin-top:3px}
.kpi .k-s{font-size:11px;color:var(--muted);margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 9px;border-bottom:1px dashed rgba(255,255,255,.06);white-space:nowrap}
.tbl .num{font-family:ui-monospace,Consolas,monospace;text-align:right}
.up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--sub)}
.badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px}
.badge.low{background:#3fb95022;color:var(--green)}
.badge.fair{background:#ffffff14;color:var(--sub)}
.badge.high{background:#ef535022;color:var(--red)}
.note{margin-top:12px;padding:8px 11px;border-radius:8px;background:#e99a3517;color:#e7c08a;font-size:12px}
.err{margin-top:12px;padding:8px 11px;border-radius:8px;background:#ef535017;color:#f0a5a3;font-size:12px}
.tabs{display:inline-flex;gap:4px}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:6px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.tabs button.active{background:var(--surface);color:var(--text);border-color:#ffffff33}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.step .no{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:#ffffff12;color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:12px;font-family:ui-monospace,Consolas,monospace}
.step .t{font-size:13px}
.step .f{font-size:12px;color:var(--sub);font-family:ui-monospace,Consolas,monospace;margin-top:3px}
.step .d{font-size:12px;color:var(--muted);font-family:ui-monospace,Consolas,monospace;margin-top:2px;word-break:break-all}
.step .v{margin-left:auto;font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--text);white-space:nowrap}
code{background:#ffffff10;padding:1px 5px;border-radius:4px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.name-tag{display:none;font-size:13px;padding:6px 10px;border-radius:8px;background:#ffffff10;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.name-tag.show{display:inline-block}
.name-tag.ok{color:var(--text);border-color:#2ecc7166;background:#2ecc711a}
.name-tag.bad{color:#ff8080;border-color:#ff6b6b66;background:#ff6b6b1a}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>📈 股票估值计算</h1>
    <button class="btn" onclick="location.href='index.html'">← 返回股票池</button>
    <div class="sub">简化 DCF（前 5 年预测 + 永续增长）｜贴现率 10%｜三档：乐观 = 机构预测增速 × 1.5、中性 = 机构预测增速、悲观固定 5%（无预测时兜底 25% / 10% / 5%）</div>
  </header>

  <section class="card">
    <div class="card-h">
      <h2>① 输入参数</h2>
      <button class="btn" id="btnToggle">展开参数</button>
    </div>
    <div class="card-b">
      <div class="input-row">
        <input id="codeInput" type="text" inputmode="numeric" maxlength="6" placeholder="股票代码，如 600519" autocomplete="off">
        <button class="btn primary" id="btnCalc">开始计算</button>
        <span class="name-tag" id="codeName"></span>
        <span class="hint" id="hint">只填代码即可自动抓取股价 / 总股本 / 净利润（TTM 归母优先），机构预测为可选项</span>
      </div>
      <div class="params" id="params">
        <label>机构预测第 N 年净利润（亿元，可选）<input id="pForecast" type="number" step="0.01" placeholder="不填则兜底：中性10% / 乐观25% / 悲观5%"></label>
        <label>期初扣非净利润（亿元）<input id="pBase" type="number" step="0.01" placeholder="留空自动取最近年报"></label>
        <label>当前股价（元）<input id="pPrice" type="number" step="0.01" placeholder="留空自动取行情"></label>
        <label>总股本（亿股）<input id="pShares" type="number" step="0.0001" placeholder="留空自动取"></label>
        <label>机构预测年数 N<input id="pForecastYears" type="number" min="1" max="10" value="3"></label>
        <label>贴现率（%）<input id="pRate" type="number" step="0.5" value="10"></label>
        <label>预测 N 年价 / 收益率<input id="pPredictYears" type="number" min="1" max="10" value="1"></label>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-h"><h2>② 计算结果</h2><span class="tag" id="stResult">待计算</span></div>
    <div class="card-b" id="bodyResult"></div>
  </section>

  <section class="card">
    <div class="card-h">
      <h2>③ 计算过程</h2>
      <span class="tabs" id="scenarioTabs"></span>
      <span class="tag" id="stSteps">待计算</span>
    </div>
    <div class="card-b" id="bodySteps"></div>
  </section>
</div>

<script>
'use strict';
const API = 'http://127.0.0.1:8000';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (v, d = 2) => (v == null || v === '' ? '—' : Number(v).toFixed(d));
const fmtPct = v => (v == null ? '—' : (v > 0 ? '+' : '') + (Number(v) * 100).toFixed(2) + '%');

const IDLE_RESULT = '<div class="empty">输入股票代码后点击「开始计算」</div>';
const IDLE_STEPS = '<div class="empty">计算过程将在此逐步展示（增长率 → 各年贴现 → 永续 → 每股价值）</div>';

let lastData = null;          // 最近一次成功的响应
let activeScenario = 'optimistic';

function setStatus(el, text, kind) {
  el.textContent = text;
  el.className = 'tag' + (kind ? ' ' + kind : '');
}

// 自动拉取的三个字段：带 auto 标记表示「系统填入」，不参与回传（换股票后由后端重新拉取）
const AUTO_FIELDS = ['pPrice', 'pShares', 'pBase'];

function readParams() {
  const num = id => {
    const v = $(id).value.trim();
    return v === '' ? null : Number(v);
  };
  // 系统自动填入的值不回传，避免换股票后仍沿用上一只的行情 / 财务数据
  const userNum = id => ($(id).dataset.auto === '1' ? null : num(id));
  return {
    code: $('codeInput').value.trim(),
    net_profit_forecast: num('pForecast'),
    net_profit_base: userNum('pBase'),
    price: userNum('pPrice'),
    shares: userNum('pShares'),
    forecast_years: num('pForecastYears') || 3,
    discount_rate: (num('pRate') ?? 10) / 100,
    predict_years: num('pPredictYears') || 1,
  };
}

function fillAuto(j) {
  const fill = (id, val) => {
    if (val == null || val === '') return;
    const el = $(id);
    if (el.dataset.auto !== '1' && el.value.trim() !== '') return;   // 用户手改过的值不覆盖
    el.value = val;
    el.dataset.auto = '1';
  };
  fill('pPrice', j.market && j.market.price);
  fill('pShares', j.market && j.market.shares);
  fill('pBase', j.finance && j.finance.net_profit_base);
}

function renderResult(j) {
  const m = j.market || {}, f = j.finance || {}, g = j.growth || {};
  const rows = (j.scenarios || []).map(s => {
    const cls = s.verdict === '低估' ? 'low' : s.verdict === '高估' ? 'high' : 'fair';
    return `<tr>
      <td>${esc(s.label)}</td>
      <td class="num">${fmtPct(s.growth)}<div class="k-s">${esc(s.growth_basis || '')}</div></td>
      <td class="num">${fmt(s.value_per_share)} 元</td>
      <td class="num">${fmt(s.undervalued_ratio, 4)}</td>
      <td><span class="badge ${cls}">${esc(s.verdict || '—')}</span></td>
      <td class="num">${fmt(s.target_price)} 元</td>
      <td class="num ${s.return_rate > 0 ? 'up' : s.return_rate < 0 ? 'down' : 'flat'}">${fmtPct(s.return_rate)}</td>
    </tr>`;
  }).join('');

  $('bodyResult').innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="k-l">股票</div><div class="k-v">${esc(j.name || j.code)}</div><div class="k-s">${esc(j.code)}</div></div>
      <div class="kpi"><div class="k-l">当前股价</div><div class="k-v">${fmt(m.price)} 元</div><div class="k-s">${esc(m.price_source || '手动输入')}</div></div>
      <div class="kpi"><div class="k-l">总股本</div><div class="k-v">${fmt(m.shares, 4)} 亿股</div><div class="k-s">${esc(m.shares_source || '手动输入')}</div></div>
      <div class="kpi"><div class="k-l">期初净利润</div><div class="k-v">${fmt(f.net_profit_base)} 亿</div><div class="k-s">${esc((f.indicator || '') + (f.period ? ' · ' + f.period : ''))}</div></div>
      <div class="kpi"><div class="k-l">复合增长率（${f.forecast_years} 年）</div><div class="k-v">${g.cagr == null ? '走兜底' : fmtPct(g.cagr)}</div><div class="k-s">${g.from_consensus ? '机构预测 ' + fmt(f.net_profit_forecast) + ' 亿' : '未提供机构预测，按模板兜底'}</div></div>
      <div class="kpi"><div class="k-l">贴现率 / 永续增长</div><div class="k-v">${fmtPct(j.assumptions.discount_rate)} / ${fmtPct(j.assumptions.perpetual_growth)}</div><div class="k-s">前段 ${j.assumptions.stage1_years} 年 + 永续</div></div>
    </div>
    <table class="tbl">
      <thead><tr>
        <th>情景</th><th class="num">增长率</th><th class="num">每股价值</th><th class="num">股价 / 价值</th>
        <th>判断</th><th class="num">预测 ${j.assumptions.predict_years} 年价</th><th class="num">预测收益率</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="note">
      <b>怎么读：</b>「股价 / 价值」小于 1 表示低估、大于 1 表示高估（本表按 &lt;0.9 低估、0.9~1.1 合理、&gt;1.1 高估划分）；
      三档增长率按模板口径：乐观 = 机构预测复合增速 × 1.5、中性 = 机构预测复合增速、悲观固定 5%；
      未提供机构预测时兜底为 25% / 10% / 5%。模型结果为估算，不构成投资建议。
    </div>
    ${(j.errors && j.errors.length) ? `<div class="err"><b>数据源提示：</b>${j.errors.map(esc).join('；')}</div>` : ''}`;
  setStatus($('stResult'), `股价 / 价值 ${fmt(j.scenarios[0].undervalued_ratio, 3)}`, 'ok');
}

function renderTabs() {
  if (!lastData) return;
  $('scenarioTabs').innerHTML = lastData.scenarios.map(s =>
    `<button data-key="${esc(s.key)}" class="${s.key === activeScenario ? 'active' : ''}">${esc(s.label)}</button>`).join('');
}

function renderSteps() {
  if (!lastData) { $('bodySteps').innerHTML = IDLE_STEPS; return; }
  const s = lastData.scenarios.find(x => x.key === activeScenario) || lastData.scenarios[0];
  const steps = [{ ...lastData.growth.steps[0] }].concat(s.steps || []);
  $('bodySteps').innerHTML = `
    <div class="steps">
      ${steps.map((x, i) => `
        <div class="step">
          <div class="no">${i + 1}</div>
          <div>
            <div class="t">${esc(x.label)}</div>
            <div class="f">${esc(x.formula)}</div>
            <div class="d">${esc(x.detail)}</div>
          </div>
          <div class="v">${fmt(x.value, 4)}</div>
        </div>`).join('')}
    </div>
    <div class="note">
      当前展示「<b>${esc(s.label)}</b>」情景的推导过程（增长率 ${fmtPct(s.growth)}）。
      说明：${(lastData.notes || []).map(esc).join('；')}
    </div>`;
  setStatus($('stSteps'), `${steps.length} 步`, 'ok');
}

async function calculate() {
  const p = readParams();
  if (!/^\d{6}$/.test(p.code)) {
    $('hint').textContent = '请输入 6 位数字股票代码（如 600519）';
    $('hint').className = 'hint bad';
    $('codeInput').focus();
    return;
  }
  $('hint').textContent = '计算中…';
  $('hint').className = 'hint';
  $('btnCalc').disabled = true;
  $('stResult').textContent = '计算中…';
  $('stResult').className = 'tag';

  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 60000);
    const res = await fetch(`${API}/api/stock/valuation`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(p),
      signal: ctrl.signal,
    });
    clearTimeout(timer);
    const j = await res.json();
    if (!j.ok) {
      $('bodyResult').innerHTML = `<div class="err"><b>${esc(j.error || '计算失败')}</b>${(j.errors && j.errors.length) ? '<br>数据源提示：' + j.errors.map(esc).join('；') : ''}</div>`;
      $('bodySteps').innerHTML = IDLE_STEPS;
      $('params').classList.add('show');
      $('btnToggle').textContent = '收起参数';
      setStatus($('stResult'), '待补充参数', 'warn');
      setStatus($('stSteps'), '待计算');
      $('hint').textContent = '请在下方补充参数后重算';
      $('hint').className = 'hint';
      return;
    }
    lastData = j;
    if (!j.scenarios.some(s => s.key === activeScenario)) activeScenario = j.scenarios[0].key;
    fillAuto(j);
    renderResult(j);
    renderTabs();
    renderSteps();
    $('hint').textContent = `已按 ${j.assumptions.discount_rate * 100}% 贴现率、${j.finance.forecast_years} 年预测计算`;
    $('hint').className = 'hint';
  } catch (e) {
    const msg = e && e.name === 'AbortError' ? '请求超时（60 秒）' : '无法连接后端（' + API + '），请确认 FastAPI 已启动';
    $('bodyResult').innerHTML = `<div class="err"><b>${esc(msg)}</b></div>`;
    setStatus($('stResult'), '失败', 'bad');
  } finally {
    $('btnCalc').disabled = false;
  }
}

$('btnCalc').addEventListener('click', calculate);
$('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
// 输入代码后自动查名称，确认没输错（输满 6 位触发，防抖 350ms）
let nameTimer = null;
let lastNameCode = '';

function clearNameTag() {
  const box = $('codeName');
  box.textContent = '';
  box.className = 'name-tag';
}

async function lookupName() {
  const code = $('codeInput').value.trim();
  if (!/^\d{6}$/.test(code)) { clearNameTag(); lastNameCode = ''; return; }
  if (code === lastNameCode) return;                  // 同一代码不重复请求
  lastNameCode = code;
  const box = $('codeName');
  box.textContent = '查询中…';
  box.className = 'name-tag show';
  try {
    const res = await fetch(`${API}/api/stock/quote?code=${code}`);
    const j = await res.json();
    if (code !== $('codeInput').value.trim()) return;  // 输入已变更，丢弃过期结果
    if (j.ok && j.name) {
      box.textContent = `${j.name}（${j.code}）` + (j.price ? ` ${j.price} 元` : '');
      box.className = 'name-tag show ok';
    } else {
      box.textContent = j.error || '未找到该代码对应的股票';
      box.className = 'name-tag show bad';
      lastNameCode = '';                               // 允许改对后重查
    }
  } catch (err) {
    box.textContent = '名称查询失败（后端未启动？）';
    box.className = 'name-tag show bad';
    lastNameCode = '';
  }
}

$('codeInput').addEventListener('input', () => {
  $('codeInput').value = $('codeInput').value.replace(/\D/g, '').slice(0, 6);
  if ($('hint').classList.contains('bad')) {
    $('hint').textContent = '只填代码即可自动抓取股价 / 总股本 / 净利润（TTM 归母优先），机构预测为可选项';
    $('hint').className = 'hint';
  }
  // 换了代码：清掉上一只股票自动填入的行情 / 财务值（用户手改过的保留），避免旧值被当成手动输入
  AUTO_FIELDS.forEach(id => {
    if ($(id).dataset.auto === '1') { $(id).value = ''; delete $(id).dataset.auto; }
  });
  clearTimeout(nameTimer);
  nameTimer = setTimeout(lookupName, 350);
});

// 用户手动编辑这三个字段后，取消自动标记，其值将优先于自动拉取结果
AUTO_FIELDS.forEach(id => {
  $(id).addEventListener('input', () => { delete $(id).dataset.auto; });
});
$('codeInput').addEventListener('blur', lookupName);   // 失焦兜底（粘贴/浏览器自动填充不触发 input 时）
$('btnToggle').addEventListener('click', () => {
  const show = $('params').classList.toggle('show');
  $('btnToggle').textContent = show ? '收起参数' : '展开参数';
});
$('scenarioTabs').addEventListener('click', e => {
  const btn = e.target.closest('button[data-key]');
  if (!btn) return;
  activeScenario = btn.dataset.key;
  renderTabs();
  renderSteps();
});

$('bodyResult').innerHTML = IDLE_RESULT;
$('bodySteps').innerHTML = IDLE_STEPS;

// 支持被其他页面带代码直接打开：valuation.html?code=600519 自动填入并计算
const presetCode = (new URLSearchParams(location.search).get('code') || '').trim();
if (/^\d{6}$/.test(presetCode)) {
  $('codeInput').value = presetCode;
  lookupName();
  calculate();
} else {
  $('codeInput').focus();
}
</script>
</body>
</html>
